
name: Calculator CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: powershell
        run: |
          python -m pytest -v

      - name: Docker Hub login
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed"
          }

      - name: Build Docker image
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $IMAGE = "$env:DOCKERHUB_USERNAME/calculator:${{ github.run_number }}"
          docker build -t $IMAGE .
          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed"
          }

      - name: Push Docker image
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $IMAGE = "$env:DOCKERHUB_USERNAME/calculator:${{ github.run_number }}"
          docker push $IMAGE
          if ($LASTEXITCODE -ne 0) {
            throw "Docker push failed"
          }

      - name: Deploy to Kubernetes
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $IMAGE = "$env:DOCKERHUB_USERNAME/calculator:${{ github.run_number }}"

          kubectl apply -f deployment.yaml
          if ($LASTEXITCODE -ne 0) { throw "Deployment apply failed" }

          kubectl apply -f service.yaml
          if ($LASTEXITCODE -ne 0) { throw "Service apply failed" }

          kubectl set image deployment/calculator calculator=$IMAGE
          if ($LASTEXITCODE -ne 0) { throw "Image update failed" }

          kubectl rollout status deployment/calculator --timeout=120s
          if ($LASTEXITCODE -ne 0) { throw "Kubernetes rollout failed" }
